name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的旧运行被新提交取代时自动取消，避免浪费 runner 时间
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          # 与 Dockerfile 的 node:18-slim 保持一致，避免「CI 通过但镜像构建失败」
          node-version: '18'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        run: npm ci

      # package.json 的 build 脚本是 "vue-tsc && vite build"，
      # 因此这一步同时覆盖类型检查与生产构建。
      - name: 类型检查与生产构建
        run: npm run build

  backend:
    name: 后端语法检查与单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: 安装依赖
        run: pip install -r backend/requirements.txt

      - name: 语法检查
        run: python -m compileall -q backend/app

      - name: 导入冒烟测试
        working-directory: backend
        run: python -c "import app.api.main"

      # 当前仓库还没有 backend/tests；此步骤在测试目录出现后自动生效，
      # 无需再改本文件。缺失时用 ::warning:: 让它保持可见，避免出现
      # 「绿色但一个测试都没跑」的假象。
      - name: 单元测试
        run: |
          if [ -d backend/tests ]; then
            python -m unittest discover -s backend/tests -v
          else
            echo "::warning::backend/tests 不存在，本次未执行任何后端单元测试"
          fi
